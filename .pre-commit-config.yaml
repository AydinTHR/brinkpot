# Enable with: pre-commit install
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # The app/node tsconfigs are JSONC (they carry comments), so skip the
        # strict JSON parser for them. Prettier still formats them.
        exclude: ^tsconfig\.(app|node)\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown, yaml, html]
      - id: eslint
        name: eslint
        entry: npx eslint --fix --max-warnings=0
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: no-emdash
        name: no em dash in docs or source
        entry: python3 scripts/check_no_emdash.py
        language: system
        types_or: [markdown, text, javascript, jsx, ts, tsx]
